  <title>Hermes refined conversation controls</title>
<rect width="1600" height="1120" fill="#F4F6FA"/><text x="88" y="88" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#2A9FE8">IN-CONTEXT · CONVERSATION</text><text x="88" y="146" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="700" fill="#1B2436">A quieter, Telegram-like message surface</text><text x="88" y="187" font-family="Inter,Arial,sans-serif" font-size="21" fill="#7A869A">Assistant and live voice stay in the top bar; the composer keeps only immediate actions.</text><g transform="translate(88 252)"><rect width="1424" height="178" rx="40" fill="#FFFFFF" filter="url(#shadow)"/><use href="#i-arrow-left" x="38" y="62" width="52" height="52" color="#687488" opacity="1"/><circle cx="138" cy="89" r="32" fill="#E6F4FD"/><text x="138" y="98" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#2A9FE8">H</text><text x="192" y="78" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#1B2436">Project delivery review</text><circle cx="202" cy="112" r="5" fill="#25BF91"/><text x="219" y="119" font-family="Inter,Arial,sans-serif" font-size="18" fill="#687488">deepseek-v4-pro · online</text><rect x="1178" y="45" width="88" height="88" rx="28" fill="#E6F8F6"/><use href="#i-waveform" x="1200" y="67" width="44" height="44" color="#28C7BE" opacity="1"/><rect x="1288" y="45" width="88" height="88" rx="28" fill="#F0EBFD"/><use href="#i-robot" x="1310" y="67" width="44" height="44" color="#7D5CE7" opacity="1"/></g><g transform="translate(88 492)"><text x="0" y="0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#8B96A9">DEFAULT · VOICE READY</text><rect x="0" y="30" width="1424" height="150" rx="48" fill="#FFFFFF" filter="url(#shadow)"/><use href="#i-paperclip" x="34" y="76" width="54" height="54" color="#687488" opacity="1"/><text x="112" y="111" font-family="Inter,Arial,sans-serif" font-size="25" fill="#98A1B2">Message Hermes…</text><circle cx="1336" cy="105" r="46" fill="#2A9FE8"/><use href="#i-microphone-fill" x="1310" y="79" width="52" height="52" color="#FFFFFF" opacity="1"/></g><g transform="translate(88 750)"><text x="0" y="0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#8B96A9">TYPING · SEND READY</text><rect x="0" y="30" width="1424" height="150" rx="48" fill="#FFFFFF" filter="url(#shadow)"/><use href="#i-paperclip" x="34" y="76" width="54" height="54" color="#687488" opacity="1"/><text x="112" y="111" font-family="Inter,Arial,sans-serif" font-size="25" fill="#1B2436">Please summarize the next three actions</text><circle cx="1336" cy="105" r="46" fill="#2A9FE8"/><use href="#i-paper-plane-tilt-fill" x="1310" y="79" width="52" height="52" color="#FFFFFF" opacity="1"/></g><g transform="translate(88 1002)"><use href="#i-terminal" x="0" y="0" width="30" height="30" color="#687488" opacity="1"/><text x="44" y="24" font-family="Inter,Arial,sans-serif" font-size="17" fill="#687488">Commands move into the attachment tray instead of occupying the composer.</text></g></svg>